name: Salesforce Code Analyzer

# workflow_dispatch is required so DevOps Center Testing can trigger this
# workflow remotely via the GitHub Actions API. Without this trigger present
# in the workflow file on a given branch, DevOps Center's sync will fail
# with a 404 "Not Found" error on that branch/stage.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-analyzer:
    name: Run Code Analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Install Code Analyzer v5 plugin
        run: sf plugins install code-analyzer -f

      - name: Run Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v2
        with:
          run-command: run
          run-arguments: >
            --target force-app
            --engine pmd
            --engine eslint
            --engine regex
            --severity-threshold 3
          results-artifact-name: code-analyzer-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-report
          path: |
            *.html
            *.json
