<template>
  <div class="slds-card slds-m-around_medium">
    <div class="slds-card__header slds-grid">
      <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__body">
          <h2 class="slds-card__title slds-text-heading_small slds-truncate">
            Feedback Form
          </h2>
        </div>
      </header>
    </div>

    <div class="slds-card__body slds-card__body_inner">
      <!-- Form Section -->
      <lwc:if lwc:when={isFormVisible}>
        <form class="slds-form" onsubmit={handleSubmit}>
          <div class="slds-form__section">
            <!-- Name Field -->
            <div class="slds-form__group">
              <lightning-input
                type="text"
                label="Name"
                name="name"
                value={formData.name}
                onchange={handleInputChange}
                required
                class="slds-m-bottom_medium"
              ></lightning-input>
            </div>

            <!-- Email Field -->
            <div class="slds-form__group">
              <lightning-input
                type="email"
                label="Email"
                name="email"
                value={formData.email}
                onchange={handleInputChange}
                required
                class="slds-m-bottom_medium"
              ></lightning-input>
            </div>

            <!-- Rating Field -->
            <div class="slds-form__group">
              <lightning-combobox
                label="Rating"
                name="rating"
                value={formData.rating}
                options={ratingOptions}
                onchange={handleInputChange}
                required
                class="slds-m-bottom_medium"
              ></lightning-combobox>
            </div>

            <!-- Comments Field -->
            <div class="slds-form__group">
              <lightning-textarea
                label="Comments"
                name="comments"
                value={formData.comments}
                onchange={handleInputChange}
                placeholder="Please share any additional feedback (optional)"
                class="slds-m-bottom_medium"
              ></lightning-textarea>
            </div>

            <!-- Submit Button -->
            <div class="slds-m-top_medium">
              <lightning-button
                variant="brand"
                type="submit"
                label="Submit"
                class="slds-m-right_small"
              ></lightning-button>
              <lightning-button
                variant="neutral"
                type="button"
                label="Reset"
                onclick={handleReset}
              ></lightning-button>
            </div>
          </div>
        </form>
      </lwc:if>

      <!-- Success Message Section -->
      <lwc:elseif lwc:when={isSuccessVisible}>
        <div class="slds-box slds-theme_success slds-p-around_medium">
          <div class="slds-grid slds-gutters_medium">
            <div class="slds-col slds-size_1-of-12">
              <lightning-icon
                icon-name="utility-success"
                alternative-text="Success"
                variant="inverse"
                size="large"
              ></lightning-icon>
            </div>
            <div class="slds-col slds-size_11-of-12">
              <h3 class="slds-text-heading_small slds-m-bottom_small">
                Thank You!
              </h3>
              <p class="slds-text-body_regular">
                Your feedback has been successfully submitted. We appreciate
                your input.
              </p>
              <lightning-button
                variant="brand"
                label="Submit Another"
                onclick={handleSubmitAnother}
                class="slds-m-top_medium"
              ></lightning-button>
            </div>
          </div>
        </div>
      </lwc:elseif>
    </div>
  </div>
</template>
